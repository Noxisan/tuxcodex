site_name: TuxCodex
site_description: Linux Administration & DevOps a handbook by Nox
site_author: Nox
repo_url: https://github.com/noxisan/tuxcodex
repo_name: tuxcodex

theme:
  name: material
  logo: assets/logo-small.png
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Linux-Administration & DevOps ein Handbuch von Nox
          nav_translations:
            Home: Startseite
            Orientation: Orientierung
            Navigation: Navigation
            Files: Dateien
            Viewing files: Dateien anzeigen
            Text processing: Textverarbeitung
            Permissions: Rechte
            Users and groups: Benutzer und Gruppen
            Overview: Übersicht

nav:
  - Home: index.md
  - Orientation:
      - Overview: 01-orientation/index.md
      - whoami: 01-orientation/whoami.md
      - id: 01-orientation/id.md
      - hostname: 01-orientation/hostname.md
      - hostnamectl: 01-orientation/hostnamectl.md
      - uname: 01-orientation/uname.md
      - uptime: 01-orientation/uptime.md
      - who: 01-orientation/who.md
      - w: 01-orientation/w.md
      - last: 01-orientation/last.md
      - date: 01-orientation/date.md
      - timedatectl: 01-orientation/timedatectl.md
  - Navigation:
      - Overview: 02-navigation/index.md
      - pwd: 02-navigation/pwd.md
      - cd: 02-navigation/cd.md
      - ls: 02-navigation/ls.md
      - tree: 02-navigation/tree.md
      - pushd: 02-navigation/pushd.md
      - popd: 02-navigation/popd.md
      - find: 02-navigation/find.md
      - locate: 02-navigation/locate.md
      - which: 02-navigation/which.md
      - whereis: 02-navigation/whereis.md
      - realpath: 02-navigation/realpath.md
  - Files:
      - Overview: 03-files/index.md
      - touch: 03-files/touch.md
      - mkdir: 03-files/mkdir.md
      - cp: 03-files/cp.md
      - mv: 03-files/mv.md
      - rm: 03-files/rm.md
      - rmdir: 03-files/rmdir.md
      - ln: 03-files/ln.md
      - stat: 03-files/stat.md
      - file: 03-files/file.md
      - truncate: 03-files/truncate.md
      - shred: 03-files/shred.md
  - Viewing files:
      - Overview: 04-viewing-files/index.md
      - cat: 04-viewing-files/cat.md
      - tac: 04-viewing-files/tac.md
      - nl: 04-viewing-files/nl.md
      - less: 04-viewing-files/less.md
      - head: 04-viewing-files/head.md
      - tail: 04-viewing-files/tail.md
      - zcat: 04-viewing-files/zcat.md
      - zless: 04-viewing-files/zless.md
      - hexdump: 04-viewing-files/hexdump.md
      - strings: 04-viewing-files/strings.md
  - Text processing:
      - Overview: 05-text-processing/index.md
      - wc: 05-text-processing/wc.md
      - sort: 05-text-processing/sort.md
      - uniq: 05-text-processing/uniq.md
      - cut: 05-text-processing/cut.md
      - tr: 05-text-processing/tr.md
      - column: 05-text-processing/column.md
      - grep: 05-text-processing/grep.md
      - sed: 05-text-processing/sed.md
      - awk: 05-text-processing/awk.md
      - diff: 05-text-processing/diff.md
      - tee: 05-text-processing/tee.md
      - xargs: 05-text-processing/xargs.md
      - jq: 05-text-processing/jq.md
  - Permissions:
      - Overview: 06-permissions/index.md
      - chmod: 06-permissions/chmod.md
      - chown: 06-permissions/chown.md
      - chgrp: 06-permissions/chgrp.md
      - umask: 06-permissions/umask.md
      - namei: 06-permissions/namei.md
      - getfacl: 06-permissions/getfacl.md
      - setfacl: 06-permissions/setfacl.md
      - lsattr: 06-permissions/lsattr.md
      - chattr: 06-permissions/chattr.md
  - Users and groups:
      - Overview: 07-users-groups/index.md
      - groups: 07-users-groups/groups.md
      - getent: 07-users-groups/getent.md
      - adduser: 07-users-groups/adduser.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - toc:
      permalink: true

extra_css:
  - stylesheets/tuxcodex.css

extra_javascript:
  - javascripts/header.js

hooks:
  - hooks/command_index.py
