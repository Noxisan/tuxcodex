site_name: TuxCodex
site_description: Linux Administration & DevOps a handbook by Nox
site_author: Nox
site_url: https://noxisan.github.io/tuxcodex/
repo_url: https://github.com/noxisan/tuxcodex
repo_name: tuxcodex

theme:
  name: material
  logo: assets/logo-small.png
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Linux-Administration & DevOps ein Handbuch von Nox
          nav_translations:
            Home: Startseite
            Orientation: Orientierung
            Navigation: Navigation
            Files: Dateien
            Viewing files: Dateien anzeigen
            Text processing: Textverarbeitung
            Permissions: Rechte
            Users and groups: Benutzer und Gruppen
            Processes: Prozesse
            systemd and services: systemd und Dienste
            Packages: Pakete
            Network: Netzwerk
            Disks and storage: Festplatten und Speicher
            Archives: Archive
            Scheduling: Zeitgesteuerte Aufgaben
            Bash scripting: Bash-Skripte
            Overview: Übersicht
            Basics: Grundlagen

